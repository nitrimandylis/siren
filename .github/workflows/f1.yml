name: f1

on:
  schedule:
    - cron: "11-59/20 * * * *" # every 20 min, offset from :00 — GitHub delays runs most at the top of the hour
  workflow_dispatch:

permissions:
  contents: write # f1/state.txt, so news is announced once instead of every 20 min

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun f1/watch.ts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # Only commits when the phase actually changed, so a quiet week leaves no
      # trace. The rebase is for the rare collision with keepalive's push.
      - run: |
          if [ ! -f f1/state.txt ]; then
            echo "no state yet — nothing has been announced"
            exit 0
          fi
          # The ID prefix is required: bare "name@users.noreply.github.com" is
          # the legacy form and GitHub credits whoever owns that username.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add f1/state.txt
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "f1 state"
            git pull --rebase -q
            git push
          fi

name: managebac

on:
  schedule:
    - cron: "23 5 * * *" # daily before school, offset from :00
  workflow_dispatch:
    inputs:
      probe:
        description: "Check that claude runs and the OAuth token still works"
        type: boolean
        default: false

permissions:
  contents: write # managebac/seen.txt, so a post is filed once and stays deleted

jobs:
  managebac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: nitrimandylis/bacpack
          path: bacpack
      - uses: oven-sh/setup-bun@v2
      - run: npm install -g @anthropic-ai/claude-code

      # The token lasts a year and its expiry is otherwise silent: the sync
      # falls back to filing untriaged rather than failing. Run the workflow by
      # hand with probe=true to check it without waiting for a teacher to post.
      - if: inputs.probe
        # Block scalar: the prompt contains a colon-space, which is illegal in
        # a plain YAML scalar and silently invalidates the whole workflow file.
        run: |
          claude -p 'Reply with exactly OK' --output-format text
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # CLAUDE_CODE_OAUTH_TOKEN is precedence #5 and bills the subscription, not
      # an API key. Do NOT add ANTHROPIC_API_KEY to this job: it is precedence
      # #3 and would silently win, sending an X-Api-Key header instead.
      # Classification is best-effort. If the token expires (one year) or the
      # quota is spent, the step still succeeds and posts file untriaged.
      #
      # bacpack logs itself in from MANAGEBAC_EMAIL and MANAGEBAC_PASSWORD, so
      # there is no session cookie to keep alive here. A runner starts with no
      # cached session, so every run logs in once. The old MANAGEBAC_COOKIE
      # secret is dead: sessions lapse after about a fortnight and this job
      # spent two weeks of them failing.
      - run: bun managebac/sync.ts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          MANAGEBAC_SCHOOL: ${{ secrets.MANAGEBAC_SCHOOL }}
          MANAGEBAC_EMAIL: ${{ secrets.MANAGEBAC_EMAIL }}
          MANAGEBAC_PASSWORD: ${{ secrets.MANAGEBAC_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # Only commits when the watermark actually moved. Without this the mark
      # resets every run and every discussion post is filed again tomorrow.
      - run: |
          if [ ! -f managebac/seen.txt ]; then
            echo "no watermark written, sync did not reach the end"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add managebac/seen.txt
          if git diff --cached --quiet; then
            echo "no new posts"
          else
            git commit -m "managebac seen"
            git pull --rebase -q
            git push
          fi

      # A lapsed session recovers on its own now, so a failure here is either a
      # rejected login or ManageBac changing shape, and both want a human today
      # rather than whenever the failure email gets read. Runs through ntfy.ts
      # so the topic is still read in exactly one place.
      - if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bun -e 'import { ping } from "./ntfy";
          await ping({
            title: "managebac sync failed",
            body: "Check the run: either the login was rejected or a page changed shape.",
            priority: "high",
            tags: "rotating_light",
            click: process.env.RUN_URL,
          })'
